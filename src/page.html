<!DOCTYPE html>
<html
  lang="en"
  style="
    --heading-family: 'hafs', serif;
    --amiri-family: 'hafs', serif;
    --uthmaniHafs: 'hafs', serif;
    --latin-font: 'DM Sans', 'hafs', serif;
  "
>

<head>
  <meta name="page-info" content="Eastern Reading">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f4ee">

  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="icons.css">
  <meta name="quran-pagination-file" content="json/pagination_madinah.json">
  <meta name="quran-page-storage-key" content="currentPageMadinah">
  <meta name="quran-words-file" content="json/quranic_words.json">
  <title>Eastern Reading · Original Quran</title>
  <link rel="stylesheet" href="styles_page.css?v=font-choices-2">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400&amp;family=Noto+Naskh+Arabic:wght@400&amp;family=Noto+Sans+Arabic&amp;display=swap">
  <script src="site.js?v=theme-icon-12"></script>
  <script src="common.js?v=shared-interactions-2"></script>
  <link rel="stylesheet" href="site-theme.css?v=mobile-panel-11">
  <link rel="stylesheet" href="reading-alignment.css?v=1">
  <link rel="stylesheet" href="mobile-reader.css?v=2">
  <script src="retire-offline.js" defer></script>
</head>

<body class="site-flow-reader">
  <header class="site-masthead">
    <nav class="site-toplinks" aria-label="Site"><a href="index.html" aria-current="page">Eastern Reading</a><a href="root.html">Roots</a><a href="maqayis.html">Dictionary</a><a href="writing.html">Writing</a></nav>
  </header>

  <section class="site-page-controls" aria-label="Reading options">
    <span class="page-selectors"><label class="site-control reader-chapter" for="sura-select"><span>Chapter</span><select id="sura-select"></select></label><span id="page-number" class="page-number" role="status" aria-live="polite"></span></span>
    <details class="reader-filters">
      <summary>More filters</summary>
      <div class="reader-filter-options">
<label class="site-control-toggle" for="translation-toggle">
      <input type="checkbox" id="translation-toggle">
      <span>Show translation</span>
    </label>
    <label class="site-control" for="font-select">Reading font
      <select id="font-select">
        <option value="Amiri Quran">Amiri Quran</option>
        <option value="Raqq">Raqq</option>

        <option value="Uthmani Hafs">Uthmani Hafs</option>
        <option value="System Arabic">System Arabic (plain)</option>
        <option value="Amiri">Amiri Naskh</option>
        <option value="Noto Naskh Arabic">Noto Naskh Arabic</option>
        <option value="Noto Sans Arabic">Noto Sans Arabic</option>
      </select>
    </label>

      <label class="site-control" for="reader-view">View
        <select id="reader-view">
          <option value="page">Mushaf pages</option>
          <option value="verses">Selected verses</option>
        </select>
      </label>
      <label class="site-control" for="verse-select">From verse
        <select id="verse-select" aria-label="From verse"></select>
      </label>
      <label class="site-control" for="verse-end-select">To verse
        <select id="verse-end-select" aria-label="To verse" disabled></select>
      </label>
      </div>
    </details>
  </section>


  <div id="quran-container" class="page">
    <nav id="reader-page-heading" class="page-navigation reader-page-heading" aria-label="Quran pages">
      <button id="prev-page" class="nav-button" type="button" aria-label="Previous page" disabled>
        <i class="fas fa-chevron-right" aria-hidden="true"></i>
      </button>
      <span class="sura-name"><strong id="page-sura-title"></strong></span>
      <button id="next-page" class="nav-button" type="button" aria-label="Next page" disabled>
        <i class="fas fa-chevron-left" aria-hidden="true"></i>
      </button>
    </nav>
  </div>

  <script src="js/mobile-reader.js?v=2"></script>
  <script src="app.js?v=mobile-panel-19"></script>
</body>

</html>
