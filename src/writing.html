    <nav class="site-toplinks" aria-label="Site"><a href="index.html">Eastern Reading</a><a href="root.html">Roots</a><a href="maqayis.html">Dictionary</a><a href="writing.html" aria-current="page">Writing</a></nav>

  <section class="site-page-controls" aria-label="Writing options">
    <span class="page-selectors"><label class="site-control reader-chapter" for="sura-select"><span>Chapter</span><select id="sura-select" aria-label="Surah"></select></label><span id="page-number" class="page-number" role="status" aria-live="polite"></span></span>
    <details class="reader-filters">
      <summary>More filters</summary>
      <div class="reader-filter-options">
<label class="site-control-toggle" for="translation-toggle">
      <input type="checkbox" id="translation-toggle">
      <span>Show translation</span>
    </label>
    <label class="site-control" for="font-select">Writing font
      <select id="font-select">

        <option value="Amiri Quran">Uthmani Hafs</option>
        <option value="System Arabic">System Arabic (plain)</option>
        <option value="Raqq">Raqq (Abbasi)</option>
        <option value="Amiri">Amiri Naskh</option>
        <option value="Noto Naskh Arabic">Noto Naskh Arabic</option>
        <option value="Noto Sans Arabic">Noto Sans Arabic</option>
      </select>
    </label>
    <label class="site-control" for="writing-style">Text style
      <select id="writing-style">
        <option value="italic">Italic</option>
        <option value="normal">Straight</option>
      </select>
    </label>


      <label class="site-control" for="reader-view">View
        <select id="reader-view">
          <option value="page">Mushaf pages</option>
          <option value="verses">Selected verses</option>
        </select>
      </label>
      <label class="site-control" for="verse-select">From verse
        <select id="verse-select" aria-label="From verse"></select>
      </label>
      <label class="site-control" for="verse-end-select">To verse
        <select id="verse-end-select" aria-label="To verse" disabled></select>
      </label>
      </div>
    </details>
  </section>

  <div id="quran-container" class="page">
    <nav id="reader-page-heading" class="page-navigation reader-page-heading" aria-label="Quran pages">

      </button>

      <button id="next-page" class="nav-button" type="button" aria-label="Next page" disabled>
        <i class="fas fa-chevron-left" aria-hidden="true"></i>
      </button>
    </nav>
  </div>
