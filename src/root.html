<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="page-info" content="Quran Root Words">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f4ee">

  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="icons.css">
  <link rel="stylesheet" href="root.css?v=selector-statistics-1">
  <title>Quran Root Words · Original Quran</title>
  <script src="site.js?v=reader-names-7"></script>
  <script src="common.js?v=shared-interactions-2"></script>
  <link rel="stylesheet" href="site-theme.css?v=physical-page-buttons-5">
  <script src="retire-offline.js" defer></script>
  <script src="json/maqayis_tools/browser_core.js"></script>
  <script src="js/root-dictionary.js?v=definition-preview-1"></script>
  <script src="js/root-statistics.js?v=1"></script>
</head>

<body>
  <header class="site-masthead">
    <div class="site-brand-group">
<a class="site-brand" href="index.html"><img class="site-logo" src="icon-192.png" alt="" width="44" height="44"><span><span class="site-eyebrow">Quran Root Words</span><span class="site-brand-name">Original Quran</span></span></a>
</div>
    <nav class="site-toplinks" aria-label="Site"><a href="index.html">Eastern Reading</a><a href="root.html" aria-current="page">Roots</a><a href="maqayis.html">Dictionary</a><a href="writing.html">Writing</a></nav>
  </header>

  <section class="site-page-controls" aria-label="Reading options">
    <label class="site-control-toggle" for="translation-toggle">
      <input type="checkbox" id="translation-toggle">
      <span>Show translation</span>
    </label>
  </section>

  <div class="book-container root-workspace">
    <!-- SEARCH (NEW) -->
    <div id="search-panel" class="search-panel">
      <div class="search-row">
        <select id="search-mode">
          <option value="arabic">Arabic Text Search</option>
          <option value="word">Arabic Word Search</option>
          <option value="english">English (translation)</option>
          <option value="ref">Ref (2:255)</option>
          <option value="root">Root Word</option>
        </select>

        <input id="search-input" type="text" placeholder="Search..." />
        <button id="search-clear" type="button">Clear</button>
      </div>

      <div id="search-status" class="search-status"></div>

      <div id="search-results" class="search-results">
        <div id="search-verse-data" class="verse-data"></div>
      </div>
    </div>


    <div id="letter-container" class="letter-container">
    </div>

    <div class="selector">
      <select id="root-select"></select>
      <!-- This will be populated based on the selected letter -->


      <select id="word-select">
        <!-- This will be populated based on the selected root word -->
      </select>
    </div>
    <div id="selector-statistics" class="selector-statistics" role="status" aria-live="polite" aria-atomic="true" hidden>
      <p><strong>Root:</strong> <span id="root-statistics-count"></span></p>
      <p><strong>Selected word:</strong> <span id="word-statistics-count"></span></p>
    </div>
    <section id="root-definition" class="root-definition" aria-labelledby="root-definition-title" hidden>
      <h2 id="root-definition-title">Maqayis al-Lugha · <span id="root-definition-root" lang="ar" dir="rtl"></span></h2>
      <p id="root-definition-status" role="status" aria-live="polite"></p>
      <div id="root-definition-content" data-expanded="false"></div>
      <button id="root-definition-more" class="root-definition-more" type="button" aria-controls="root-definition-content" aria-expanded="false" hidden>More…</button>
      <button id="root-definition-retry" type="button" hidden>Try again</button>
    </section>

    <div id="quran-container">
      <div id="verse-data" class="verse-data">
        <!-- Verse data will be displayed here -->
      </div>

    </div>

    <script src="js/root.js?v=shared-reader-1"></script>

</body>

</html>
