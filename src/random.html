<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="page-info" content="Random Verse">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f4ee">

  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="icons.css">
  <title>Random Verse · Original Quran</title>
  <!-- Open Graph / Twitter meta for richer embeds -->
  <meta property="og:title" content="Random Quran Verse">
  <meta property="og:description" content="A randomly selected Quran verse — refresh for a new verse or share a specific one with ?verse=123">
  <meta property="og:image" content="icon.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:creator" content="@yourhandle">
  <link rel="stylesheet" href="styles_page.css">
  <style>
    /* Minimal tweaks for a shareable single-verse page */
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .card { max-width:900px; width:100%; padding:36px; box-shadow:0 6px 30px rgba(0,0,0,0.12); border-radius:8px; text-align:center; background:var(--page-bg,#fff); }
    .arabic-verse { margin:0 0 18px; font:clamp(28px, 5vw, 48px)/1.6 Qahiri, serif; direction:rtl; unicode-bidi:isolate; text-align:center; overflow-wrap:anywhere; }
    .meta { margin-top:8px; color:#555; }
    .actions { margin-top:18px; }
    .btn { display:inline-block; padding:8px 14px; border-radius:6px; background:#1da1f2; color:#fff; text-decoration:none; margin:0 6px; }
  </style>
  <script src="site.js?v=reader-names-7"></script>
  <script src="common.js?v=page-controls-1"></script>
  <link rel="stylesheet" href="site-theme.css?v=physical-page-buttons-5">
  <script src="retire-offline.js" defer></script>
</head>

<body class="font-qahiri site-random">
  <header class="site-masthead">
    <a class="site-brand" href="index.html"><img class="site-logo" src="icon-192.png" alt="" width="44" height="44"><span><span class="site-eyebrow">Random Verse</span><span class="site-brand-name">Original Quran</span></span></a>
    <nav class="site-toplinks" aria-label="Site"><a href="index.html">Eastern Reading</a><a href="root.html">Roots</a><a href="maqayis.html">Dictionary</a><a href="writing.html">Writing</a></nav>
  </header>

  <div class="card">
    <p id="verse" class="arabic-verse" lang="ar" dir="rtl">Loading…</p>
    <div id="meta" class="meta"></div>
    <div class="actions">
      <a id="tweet" class="btn" target="_blank" rel="noopener noreferrer">Share on Twitter</a>
      <a id="copy" class="btn" href="#">Copy</a>
    </div>
  </div>

  <script>
    // Fetch minimal data, pick a random verse (or use ?verse=) and render it.
    async function loadRandomVerse() {
      const finishLoading = window.SiteUI.beginLoading();
      try {
        const [suraData, combined, words] = await Promise.all([
          QuranUtils.loadJSON('json/sura.json'),
          QuranUtils.loadJSON('json/combined_quran.json'),
          QuranUtils.loadJSON('json/quran_words.json')
        ]);

        const verseKeys = Object.keys(combined);
        if (!verseKeys.length) throw new Error('No verses');

        // Support deterministic verse selection via ?verse=
        const params = new URLSearchParams(window.location.search);
        const vparam = params.get('verse');
        let randKey = null;
        if (vparam) {
          // numeric global id
          if (/^\d+$/.test(vparam) && combined[vparam]) {
            randKey = String(parseInt(vparam, 10));
          } else {
            // try sura:ayah form
            const m = vparam.match(/^(\d+)\s*[:,-]\s*(\d+)$/);
            if (m) {
              const sNo = m[1];
              const ay = parseInt(m[2], 10);
              const s = suraData[String(sNo)];
              if (s && typeof s.start === 'number') {
                const gid = s.start + (ay - 1);
                if (combined[String(gid)]) randKey = String(gid);
              }
            }
          }
        }

        if (!randKey) {
          randKey = verseKeys[Math.floor(Math.random() * verseKeys.length)];
        }
        const verseObj = combined[randKey];

        // Build Arabic from word positions
        const start = verseObj.start_word;
        const end = verseObj.end_word;
        const wordsArr = [];
        for (let i = start; i <= end; i++) {
          const w = words[i.toString()];
          if (w) wordsArr.push(w);
        }

        const arabic = wordsArr.join(' ');

        const meta = (() => {
          // find sura & ayah
          // combined keys are global verse ids; need to find which sura contains this verse
          for (const k of Object.keys(suraData)) {
            const s = suraData[k];
            if (verseObj && s && typeof s.start === 'number') {
              const startIdx = s.start;
              const endIdx = s.end;
              const vid = parseInt(randKey, 10);
              if (vid >= startIdx && vid <= endIdx) {
                const ayah = vid - startIdx + 1;
                return `${s.name} — ${k}:${ayah}`;
              }
            }
          }
          return '';
        })();

        // Natural document flow keeps long verses fully visible at every screen size.
        document.getElementById('verse').textContent = arabic;
        document.getElementById('meta').textContent = meta;

        const tweet = document.getElementById('tweet');
        // share the current full URL (includes ?verse= if used)
        const shareUrl = window.location.href;
        const shareText = `${arabic} — ${meta}`;
        tweet.href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText) + '&url=' + encodeURIComponent(shareUrl);

        const copyBtn = document.getElementById('copy');
        copyBtn.addEventListener('click', (e) => {
          e.preventDefault();
          const text = `${arabic}\n\n${meta}`;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
              copyBtn.textContent = 'Copied';
              setTimeout(() => copyBtn.textContent = 'Copy', 1500);
            }).catch(() => alert('Copy failed'));
          } else {
            // Fallback: create temporary textarea
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); copyBtn.textContent = 'Copied'; setTimeout(() => copyBtn.textContent = 'Copy', 1500); } catch { alert('Copy failed'); }
            ta.remove();
          }
        });

      } catch (err) {
        console.error(err);
        document.getElementById('verse').textContent = 'Unable to load this verse.';
        window.SiteUI.reportError(err);
      } finally {
        finishLoading();
      }
    }

    loadRandomVerse();
  </script>
</body>

</html>
