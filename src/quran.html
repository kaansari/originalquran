<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="icons.css">
    <title>Quran Viewer</title>
    <link rel="stylesheet" href="./styles.css">
  <script src="common.js"></script>
</head>

<body>


    <div class="hamburger-menu">
      <input type="checkbox" id="menu-toggle" />
      <label for="menu-toggle" class="menu-icon">
        <span class="menu-line"></span>
        <span class="menu-line"></span>
        <span class="menu-line"></span>
      </label>

      <div class="menu-content">


        <span>Show Translation</span>
        <label class="toggle-switch">
          <input type="checkbox" id="translation-toggle">
          <span class="slider"></span>
        </label>
        <a href="./">
          <i class="fas fa-book"> </i>
        </a>
        <a href="https://github.com/kaansari/originalquran" target="_blank" rel="noopener noreferrer" aria-label="GitHub Repository">
          <i class="fab fa-github"> </i>
        </a>
  

         <!-- Font Selection Dropdown -->
      <label for="font-select">Choose Font:</label>
      <select id="font-select">
        <option value="Amiri Quran">Amiri Quran</option>
        <option value="Raqq">Raqq</option>     
      </select>

        <span>Dark Theme</span>
        <label class="toggle-switch">

          <input type="checkbox" id="theme-toggle">
          <span class="slider"></span>
        </label>
      </div>

    </div>




   <span style="margin-left: 100px;">
    <select id="sura-select"></select>
    <select id="verse-select"></select>
   </span>


<blockquote id="quran-container"></blockquote>

<script src="app_quran.js">
</script>
</body>

</html>
