<a class="site-brand" href="index.html"><img class="site-logo" src="icon-192.png" alt="" width="44" height="44"><span><span class="site-eyebrow">Quran Reader</span><span class="site-brand-name">Original Quran</span></span></a>

      <select id="sura-select"></select>
      <select id="verse-select"></select>
      <span id="page-number" class="page-number" role="status" aria-live="polite"></span>
    </span>

    <button id="next-page" class="nav-button" disabled>
       <i class="fas fa-chevron-left"></i>
