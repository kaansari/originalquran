  <style>
    /* Restore the original color font for the Amiri choice on Full Chapters. */
    body.site-chapters { --amiri-family: "Amiri Quran", "hafs", serif; }
    body.site-chapters #quran-container .font-amiri,
    body.site-chapters #quran-container .font-amiri * { font-palette: normal; }
    /* Explicit layering keeps the number inside its ornament with either font. */
    body.site-chapters #quran-container .chapter-verse-marker {
      display: inline-grid;
      place-items: center;
      min-width: 2.6em;
      min-height: 2.6em;
      line-height: 1;
      vertical-align: middle;
      direction: ltr;
      unicode-bidi: isolate;
      font-family: "hafs", serif;
      white-space: nowrap;
    }
    .chapter-verse-marker > span { grid-area: 1 / 1; }
    .chapter-verse-ornament { font-size: 2.4em; line-height: 1; }
    .chapter-verse-digits { position: relative; font-size: 1em; line-height: 1; }
  </style>
</head>

<body class="site-chapters">
  <header class="site-masthead">
    <nav class="site-toplinks" aria-label="Site"><a href="index.html">Eastern Reading</a><a href="root.html">Roots</a><a href="maqayis.html">Dictionary</a><a href="writing.html">Writing</a></nav>
  </header>

   <div class="site-reader-selectors site-page-controls" role="group" aria-label="Reading options">
    <span class="page-selectors"><label class="site-control reader-chapter" for="sura-select"><span>Chapter</span><select id="sura-select"></select></label></span>
    <details class="reader-filters">
      <summary>More filters</summary>
      <div class="reader-filter-options">
<label class="site-control-toggle" for="translation-toggle">
      <input type="checkbox" id="translation-toggle">
      <span>Show translation</span>
    </label>
    <label class="site-control" for="font-select">Reading font
      <select id="font-select">
        <option value="Amiri Quran">Amiri Quran</option>
        <option value="Raqq">Raqq</option>
      </select>
    </label>

    <label class="site-control" for="verse-select">Verse<select id="verse-select"></select></label>
      </div>
    </details>
  </div>


<div id="quran-container" class="page"></div>

<script src="app.js?v=chapter-markers-11">
