<!DOCTYPE html>
<html
  lang="en"
  style="
    --heading-family: 'warsh', serif;
    --amiri-family: 'warsh', serif;
    --uthmaniHafs: 'warsh', serif;
    --latin-font: 'DM Sans', serif;
  "
>

<head>
  <meta name="page-info" content="Western Reading">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f4ee">

  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="icons.css">
  <meta name="quran-pagination-file" content="json/pagination_madinah.json">
  <meta name="quran-page-storage-key" content="currentPageMadinah">
  <meta name="quran-words-file" content="json/quranic_warsh_words.json">
  <title>Western Reading · Original Quran</title>
  <link rel="stylesheet" href="styles_page.css?v=font-choices-2">
  <script src="site.js?v=priority-controls-13"></script>
  <script src="common.js?v=shared-interactions-2"></script>
  <link rel="stylesheet" href="site-theme.css?v=priority-controls-12">
  <link rel="stylesheet" href="reading-alignment.css?v=1">
  <link rel="stylesheet" href="mobile-reader.css?v=priority-controls-4">
  <script src="retire-offline.js" defer></script>
</head>

<body class="site-flow-reader">
  <header class="site-masthead">
    <nav class="site-toplinks" aria-label="Site"><a href="index.html">Eastern Reading</a><a href="root.html">Roots</a><a href="maqayis.html">Dictionary</a><a href="writing.html">Writing</a></nav>
  </header>

  <section class="site-page-controls" aria-label="Reading options">
    <span class="page-selectors"><label class="site-control reader-chapter" for="sura-select"><span>Chapter</span><select id="sura-select"></select></label><label class="site-control reader-verse" for="verse-select"><span>Verse</span><select id="verse-select" aria-label="Verse"></select></label></span>
    <details class="reader-filters">
      <summary>More filters</summary>
      <div class="reader-filter-options">
<label class="site-control-toggle" for="translation-toggle">
      <input type="checkbox" id="translation-toggle">
      <span>Show translation</span>
    </label>
    <label class="site-control" for="font-select">Reading font
      <select id="font-select">
  <option value="Amiri Quran">Uthmani- Turkish Script</option>
  <option value="Raqq">Abbasi Script</option>
</select>
    </label>

      <label class="site-control" for="reader-view">View
        <select id="reader-view">
          <option value="page">Mushaf pages</option>
          <option value="verses">Selected verses</option>
        </select>
      </label>

      <label class="site-control" for="verse-end-select">To verse
        <select id="verse-end-select" aria-label="To verse" disabled></select>
      </label>
      </div>
    </details>
  </section>


  <div id="quran-container" class="page">
    <nav id="reader-page-heading" class="page-navigation reader-page-heading" aria-label="Quran pages">
      <button id="prev-page" class="nav-button" type="button" aria-label="Previous page" disabled>
        <i class="fas fa-chevron-right" aria-hidden="true"></i>
      </button>
      <span class="reader-title"><span class="sura-name"><strong id="page-sura-title"></strong></span><span id="page-number" class="page-number" role="status" aria-live="polite"></span></span>
      <button id="next-page" class="nav-button" type="button" aria-label="Next page" disabled>
        <i class="fas fa-chevron-left" aria-hidden="true"></i>
      </button>
    </nav>
  </div>

  <script src="js/mobile-reader.js?v=2"></script>
  <script src="app.js?v=reference-only-21"></script>
</body>

</html>
